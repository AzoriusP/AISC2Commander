name: Feature request
description: 提交功能或体验改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        此表单用于产品建议，不用于提交代码补丁或重新发布版本。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景或问题
      description: 请说明希望解决的实际问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的行为，不要附带项目源码副本或编译文件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，且理解提交建议不会获得修改、商业使用或再发布许可。
          required: true
